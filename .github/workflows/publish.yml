name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run build
        run: npm run build

      - name: Run tests
        run: npm test

      # Trusted publishing: npm exchanges this job's OIDC token (id-token: write)
      # for a short-lived publish token, so no NPM_TOKEN secret is used.
      # No --provenance: npm only generates provenance from public repositories,
      # and this one is private.
      - name: Publish to npm
        run: npm publish --access public
